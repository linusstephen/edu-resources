<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Vocabulary-Spelling | LunaSonya</title>
<script>
document.addEventListener('contextmenu', function(e) {
  e.preventDefault();
});
</script>
<link rel="stylesheet" href="lscw.css">
</head>
<body>
<section class="panel">
<header>
<h1>P5U6 Martial Arts | Vocabulary-Spelling | Spelling W5</h1>
</header>
<div class="main" id="gamePage">
<div class="topRow">
<div id="progress">Word 1 of 15</div>
<div id="score">0/15 correct</div>
</div>
<div class="wordBox">
<div class="word covered" id="targetWord"></div>
</div>
<div class="writeRow">
<input id="inputBox" class="hidden" placeholder="Enter the spelling word..." autocomplete="off" spellcheck="false"/>
<span id="resultTag" class="hidden"></span>
</div>
<div class="controls" id="controls">
<div class="btnRow">
<button id="btnLook">Look</button>
<button id="btnSay" disabled>Say</button>
<button id="btnCover" disabled>Cover</button>
<button id="btnWrite" disabled>Write</button>
<button id="btnCheck" class="primary" disabled>Check</button>
<button id="btnNext" class="next" disabled>Next Word</button>
<button id="btnReset" class="danger">Restart Word</button>
</div>
<div class="controlsFooter">© <span id="year"></span> Linus Stephen</div>
</div>
</div>
<div class="congratsWrap hidden" id="congratsPage">
<div class="congratsTitle">You've completed all the words!</div>
<div style="color:#e6e6e6">You got <span id="finalScore">15/15</span> correct.</div>
<div class="wordsGrid" id="wordsGrid"></div>
<div class="playAgainRow">
<button id="btnPlayAgain" class="primary">Practice Again</button>
</div>
</div>
</section>
<script>
const words=["strength","derived","skilful","extremely","swift","athletes","unique","practitioner","commands","reserved","instructors","characteristics","effective","determination","discipline"];
let idx=0,stage=0;
const stats=new Map();
function initStats(){stats.clear();words.forEach(w=>stats.set(w,{correct:false}));}
initStats();
const targetWord=document.getElementById("targetWord");
const inputBox=document.getElementById("inputBox");
const progress=document.getElementById("progress");
const score=document.getElementById("score");
const resultTag=document.getElementById("resultTag");
document.getElementById("year").textContent=new Date().getFullYear();
const btnLook=document.getElementById("btnLook");
const btnSay=document.getElementById("btnSay");
const btnCover=document.getElementById("btnCover");
const btnWrite=document.getElementById("btnWrite");
const btnCheck=document.getElementById("btnCheck");
const btnNext=document.getElementById("btnNext");
let audioCtx=null;
function tone(f,d){
  if(!audioCtx) audioCtx=new(window.AudioContext||window.webkitAudioContext)();
  const o=audioCtx.createOscillator();
  const g=audioCtx.createGain();
  o.frequency.value=f;
  g.gain.value=0.06;
  o.connect(g); g.connect(audioCtx.destination);
  o.start(); setTimeout(()=>o.stop(),d);
}
function soundCorrect(){tone(880,100);setTimeout(()=>tone(1175,120),120);}
function soundWrong(){tone(220,250);}
function playCelebration(){
  if(!audioCtx) audioCtx=new(window.AudioContext||window.webkitAudioContext)();
  const notes=[523,659,784,1046,880,1046];
  let t=audioCtx.currentTime;
  notes.forEach(f=>{
    const o=audioCtx.createOscillator();
    const g=audioCtx.createGain();
    o.type="triangle";
    o.frequency.value=f;
    g.gain.setValueAtTime(0.08,t);
    g.gain.exponentialRampToValueAtTime(0.001,t+0.3);
    o.connect(g); g.connect(audioCtx.destination);
    o.start(t); o.stop(t+0.3);
    t+=0.18;
  });
}
function speak(word){
  if("speechSynthesis" in window){
    speechSynthesis.cancel();
    const utter = new SpeechSynthesisUtterance(word);
    utter.lang = "en-GB";
    const pickVoice = () => {
      const voices = speechSynthesis.getVoices();
      const britishVoice = voices.find(v => /^en-GB$/i.test(v.lang))
        || voices.find(v => /british|uk|england/i.test(v.name));
      if(britishVoice) utter.voice = britishVoice;
      speechSynthesis.speak(utter);
    };
    const voices = speechSynthesis.getVoices();
    if(voices.length){
      pickVoice();
    }else{
      speechSynthesis.onvoiceschanged = () => {
        pickVoice();
      };
    }
  }
}
function update(){
  targetWord.textContent=words[idx];
  progress.textContent=`Word ${idx+1} of ${words.length}`;
  score.textContent=`${[...stats.values()].filter(v=>v.correct).length}/${words.length} correct`;
}
function resetStages(){
  stage=0;
  btnLook.disabled=false;
  btnSay.disabled=true;
  btnCover.disabled=true;
  btnWrite.disabled=true;
  btnCheck.disabled=true;
  btnNext.disabled=true;
  inputBox.classList.add("hidden");
  inputBox.value="";
  resultTag.className="hidden";
  targetWord.classList.add("covered");
}
btnLook.onclick=()=>{if(stage!==0)return;targetWord.classList.remove("covered");btnSay.disabled=false;stage=1;}
btnSay.onclick = () => {
  if(stage < 1) return; // only block if Look not done yet
  speak(words[idx]);
  // Only move to next stage once
  if(stage === 1){
    btnCover.disabled = false;
    stage = 2;
  }
};
btnCover.onclick=()=>{if(stage!==2)return;targetWord.classList.add("covered");btnWrite.disabled=false;stage=3;}
btnWrite.onclick=()=>{if(stage!==3)return;inputBox.classList.remove("hidden");btnCheck.disabled=false;stage=4;inputBox.focus();}
btnCheck.onclick=()=>{
  if(stage!==4)return;
  const typed=inputBox.value.trim().toLowerCase();
  if(!typed)return;
  resultTag.classList.remove("hidden");
  if(typed===words[idx]){
    stats.get(words[idx]).correct=true;
    resultTag.className="tag good";
    resultTag.textContent="Correct";
    targetWord.classList.remove("covered");
    soundCorrect();
    speak(words[idx]);
    btnNext.disabled=false;
    if([...stats.values()].every(v=>v.correct)) showCongrats();
  }else{
    resultTag.className="tag bad";
    resultTag.textContent="《 Click to try again";
    soundWrong();
    btnNext.disabled=true;
  }
  update();
};
document.getElementById("btnNext").onclick=()=>{
  if(btnNext.disabled) return;
  idx=(idx+1)%words.length;
  update();
  resetStages();
};
document.getElementById("btnReset").onclick=()=>{
  stats.get(words[idx]).correct=false;
  update();
  resetStages();
};
inputBox.addEventListener("keydown",e=>{if(e.key==="Enter")btnCheck.click();});
function showCongrats(){
  document.getElementById("gamePage").classList.add("hidden");
  document.getElementById("congratsPage").classList.remove("hidden");
  document.getElementById("finalScore").textContent=`${words.length}/${words.length}`;
  const grid=document.getElementById("wordsGrid");
  grid.innerHTML="";
  words.forEach(w=>{
    const d=document.createElement("div");
    d.className="wordCell";
    d.textContent=w;
    grid.appendChild(d);
  });
  playCelebration();
}
document.getElementById("btnPlayAgain").onclick=()=>{
  idx=0;stage=0;initStats();
  document.getElementById("congratsPage").classList.add("hidden");
  document.getElementById("gamePage").classList.remove("hidden");
  update();
  resetStages();
};
update();
resetStages();
</script>
</body>
</html>
